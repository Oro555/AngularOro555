<div class="container-fluid">
  <div class="card p-4 align-items-center">
  <h2 class="display-6">Lista de Tareas Redux</h2>
  <div class="mb-3 d-flex justify-content-center align-items-center ">
    <input type="text" class="form-control mb-2" #taskInput placeholder="¿Qué hay que hacer?" aria-label="First name">
    <button class="btn btn-success ms-2" (click)="onAddTask(taskInput.value); taskInput.value=''">
      Agregar
    </button>
  </div>
  <div class="card p-2">
    <div data-bs-spy="scroll" data-bs-target="#navbar-example3" data-bs-smooth-scroll="true"
      class="scrollspy-example-2 h-50" tabindex="0">
      <ul>
        @for (task of tasks(); track task.id) {
        <li style="margin-top: 10px; display: flex; align-items: center; gap: 10px;">
          <span class="estilo-nota" [style.textDecoration]="task.completed ? 'line-through' : 'none'"
            [style.color]="task.completed ? '#888' : '#000'" (click)="onToggleTask(task.id)"
            style="cursor: pointer; user-select: none;">
            {{ task.title }}
          </span>
          <button class="btn btn-outline-danger" (click)="onDeleteTask(task.id)"> Eliminar</button>
        </li>
        } @empty {
        <p style="color: #666;">No tienes tareas agregadas.</p>
        }
      </ul>
    </div>
  </div>
</div>
</div>
