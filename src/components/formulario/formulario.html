<div class="container">
  <div class="form">
    <form [formGroup]="profileForm" (ngSubmit)="handleSubmit()">
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" formControlName="nombre" />
      <label for="apellido">Apellido</label>
      <input id="apellido" type="text" formControlName="apellido" />
      <label for="telefono">Teléfono</label>
      <input id="telefono" type="text" formControlName="telefono" />
      <label for="direccion">Dirección</label>
      <input id="direccion" type="text" formControlName="direccion" />
      <label for="email">Correo</label>
      <input id="email" type="email" formControlName="email" />
    </form>
    <button type="submit" [disabled]="profileForm.invalid">Enviar</button>
  </div>
  <div class="row">
    <table class="table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Teléfono</th>
          <th>Dirección</th>
          <th>Email</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>{{ profileForm.value.nombre }}</td>
          <td>{{ profileForm.value.apellido }}</td>
          <td>{{ profileForm.value.telefono }}</td>
          <td>{{ profileForm.value.direccion }}</td>
          <td>{{ profileForm.value.email }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
