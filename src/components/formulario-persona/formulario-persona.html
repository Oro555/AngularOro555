<h2>Alta Persona</h2>
<p>
  <span>Nombre</span>
  <input type="text" [(ngModel)]="cliente.nombre">
</p>
<p>
  <span>CIF: </span>
  <input type="text" [(ngModel)]="cliente.cif">
</p>
<p>
  <span>Dirección:</span>
  <select type="text" [(ngModel)]="cliente.grupo">
    <option value="" *ngFor="let grupo of grupos" value="grupo.id">{{grupo.nombre}}</option>
  </select>
</p>
<p>
  <button (click)="this.nuevoCliente()"> Guardar</button>
</p>

<app-listado-personas></app-listado-personas>
